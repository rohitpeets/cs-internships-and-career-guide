name: Daily refresh

on:
  schedule:
    # Cron runs in UTC: 11:17 UTC = 5:17 a.m. Central (6:17 a.m. during daylight time).
    # Off the top of the hour, because runs scheduled at :00 are often delayed.
    - cron: "17 11 * * *"
  workflow_dispatch: # "Run workflow" button for maintainers
  push:
    # A maintainer adding postings by hand gets a quick run.
    # Only collaborators can push, and the bot's own commits don't trigger workflows.
    branches: [main]
    paths: ["data/manual.yaml"]

# No token access unless a job asks for it below.
permissions: {}

jobs:
  # Full refresh on the daily schedule or a manual run.
  # Fast path (no fetching or link checks) when manual.yaml changes.
  refresh:
    name: Refresh the board
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # commit README.md, the table files and data/
    # Only one refresh writes at a time, so two runs never push over each other.
    concurrency:
      group: board-writer
      cancel-in-progress: false
    env:
      FULL_RUN: ${{ github.event_name != 'push' }}
    steps:
      # Actions pinned to full commit SHAs, so a moved tag can't change what runs with write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # validate.py compares against recent commits of postings.json
          # The write token is not left in .git/config while Python parses third-party job feeds;
          # only the final push step gets it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # Every package, indirect ones included, is pinned by hash.
      - run: pip install --require-hashes -r requirements.txt

      # Parsers are tested against saved fixtures before anything is fetched or changed,
      # so a broken parser fails the run instead of publishing.
      - name: Run tests
        run: python -m pytest -q

      # Cloud feeds: Greenhouse, Lever, Ashby, SmartRecruiters, Amazon, Eightfold.
      # Workday and Oracle come from the laptop's nightly run (data/local.json).
      - name: Fetch company job boards
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_ats.py --cloud

      - name: Merge laptop results (Workday, Oracle)
        run: python scripts/merge_local.py

      - name: Load manual postings
        run: python scripts/load_manual.py

      - name: Classify sections and tags
        run: python scripts/classify.py

      # Feed rows close when they drop out of their company feed twice, so they aren't link-checked.
      - name: Check manual links
        if: env.FULL_RUN == 'true'
        run: python scripts/check_links.py --stale-only

      # Schema check, plus fail if open postings fell below half of the 7-commit high
      # (an intended drop is committed with [reset-baseline] in the message).
      - name: Validate data
        run: python scripts/validate.py

      - name: Build README and tables
        run: python scripts/build_readme.py

      # Pull first in case a maintainer pushed while this run was working; retry if the laptop pushed in between.
      # The token is passed as a one-off header for these commands only and never written to disk.
      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git add -A README.md INTERNSHIPS*.md NEW_GRAD*.md EARLY*.md NEW_THIS_WEEK.md track-*.md _data/ data/ assets/search-index.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Board refresh $(TZ=America/Chicago date +%Y-%m-%d)"
          for i in 1 2 3; do
            git -c http.extraheader="$auth" pull --rebase && git -c http.extraheader="$auth" push && exit 0
            echo "Push attempt $i failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Could not push the refresh after 3 attempts"
          exit 1

      # Last, so it never blocks the refresh: fails the run (which emails the owner) when the laptop's
      # Workday/Oracle data is more than 36 hours old.
      - name: Check laptop data is fresh
        if: env.FULL_RUN == 'true'
        run: python scripts/check_freshness.py
