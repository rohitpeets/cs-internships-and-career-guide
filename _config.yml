title: "Things I Wish I Knew: CS Edition"
description: "Daily-updated CS internships, new grad jobs and freshman programs in the U.S., with visa/CPT tags for international students, plus free guides on resumes, projects, LeetCode, networking and interviews."
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
exclude:
  - data/
  - scripts/
  - tests/
  - requirements.txt
  - .github/
